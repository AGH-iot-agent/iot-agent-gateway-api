server:
  port: 8080

spring:
  application:
    name: iot-agent-gateway-api

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://iot-agent-auth-dev.iotag-dev.com/realms/master
  routes:
    - path: "/auth"
      service: iot-agent-authentication
      port: 80
    - path: "/devices"
      service: iot-agent-device-api
    - path: "/alerts"
      service: iot-agent-alert-api
    - path: "/logs"
      service: iot-agent-logs
    - path: "/summary"
      service: iot-agent-dashboard-api
    - path: "/api/summary"
      service: iot-agent-dashboard-api
    - path: "/api/devices"
      service: iot-agent-dashboard-api
    - path: "/telemetry"
      service: iot-agent-dashboard-api

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
